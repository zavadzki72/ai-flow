version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dummy-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: dummy
      POSTGRES_PASSWORD: dummy@local
      POSTGRES_DB: dummy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dummy -d dummy']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
